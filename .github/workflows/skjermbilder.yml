name: Skjermbilder

# Tar skjermbilder av ShowCue på Windows og Mac (norsk og engelsk) til manualene, og legger dem i docs/skjermbilder.
# Appen startes med --screenshots <mappe> --language nb|en: den lager et demoshow, tar bildene og avslutter.
# Kjør manuelt under Actions når brukerflaten er endret (eller ved push til grenen «manual-skjermbilder»).
on:
  workflow_dispatch:
  push:
    branches: [manual-skjermbilder]
    paths: ['Windows/**', 'Mac/**', 'i18n/**', '.github/workflows/skjermbilder.yml']

permissions:
  contents: read

concurrency:
  group: skjermbilder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Bygg
        run: dotnet publish Windows/ShowCue/ShowCue.csproj -c Release -r win-x64 --self-contained true -o shot

      - name: Ta skjermbilder
        shell: pwsh
        run: |
          foreach ($lang in 'nb', 'en') {
            $dir = Join-Path $pwd "bilder/windows/$lang"
            $p = Start-Process -FilePath shot/ShowCue.exe -ArgumentList '--screenshots', "`"$dir`"", '--language', $lang -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "::warning::ShowCue ($lang) ble ikke ferdig" }
            if (Test-Path "$dir/logg.txt") { Get-Content "$dir/logg.txt" }
          }
          Get-ChildItem -Recurse bilder | Select-Object FullName, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skjermbilder-windows
          path: bilder
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Mac
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bygg ShowCue.app
        working-directory: Mac
        run: ./build-app.sh

      - name: Ta skjermbilder
        run: |
          for lang in nb en; do
            dir="$PWD/bilder/mac/$lang"
            if [ "$lang" = en ]; then locale=en_GB; else locale=nb_NO; fi
            Mac/build/ShowCue.app/Contents/MacOS/ShowCue --screenshots "$dir" --language "$lang" -AppleLocale "$locale" -AppleLanguages "($lang)" &
            pid=$!
            for i in $(seq 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null && echo "::warning::ShowCue ($lang) ble ikke ferdig" || true
            cat "$dir/logg.txt" 2>/dev/null || true
          done
          ls -laR bilder

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skjermbilder-mac
          path: bilder
          if-no-files-found: error
          retention-days: 7

  # Legger bildene på grenen «skjermbilder-ut/<gren>» (erstattes hver gang). Derfra hentes de inn i en vanlig commit:
  #   git fetch origin skjermbilder-ut/<gren> && git checkout FETCH_HEAD -- docs/skjermbilder
  publish:
    name: Legg ut bildene
    needs: [windows, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: skjermbilder-*
          merge-multiple: true
          path: nye

      - name: Push til skjermbilder-ut/${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ut/docs/skjermbilder
          (cd nye && find . -name '*.png' -exec cp --parents {} ../ut/docs/skjermbilder/ \;)
          cd ut
          git init -q -b ut
          git add docs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Skjermbilder fra ${{ github.ref_name }} (${{ github.sha }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/skjermbilder-ut/${{ github.ref_name }}"
